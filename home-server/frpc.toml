# The RELAY tunnel: serverAddr is the relay's permanent static IP, which lives on a
# passthrough NLB forwarding rule rather than the VM's own network interface, so the
# address stays valid and reserved even while the relay VM is stopped. Proxies here
# only need to be reachable while the relay is actually up, unlike
# home-server/frpc-catcher.toml's proxies, which need catcher specifically, always.
#
# Nothing rewrites this file any more. It used to be rewritten on every relay boot,
# because the relay's address was ephemeral and changed each time: frpc_resolve_loop.ts
# polled DNS for it and relay_ip_push_listener.ts took a direct push from catcher to
# beat DNS. Both existed solely to chase a moving address, and both are gone. On a cold
# start frpc's own reconnect loop now closes the gap in about a second, against a target
# it already knows, instead of waiting 30-75s for a public DNS record to propagate.
serverAddr = "YOUR_RELAY_STATIC_IP"
serverPort = 7000
auth.method = "token"
auth.token = "REPLACE_ME"

[[proxies]]
name = "minecraft"
type = "tcp"
localIP = "127.0.0.1"
localPort = 25565
remotePort = 25565

[proxies.transport]
proxyProtocolVersion = "v2"

# Carries relay/udp_relay_relay.ts's control channel when this tunnel is pointed at
# the relay (2026-07-19 addition, gives Bedrock players the same low-latency relay
# path Java players already get; the relay had zero Bedrock support before this,
# confirmed live: mc.mliem.com flipping to the relay's IP on every wake silently
# broke Bedrock connectivity for real players until this existed). Belongs on THIS
# dynamic tunnel, not the permanent one: it only ever needs to be reachable while
# serverAddr above actually points at the relay, which is exactly when this file's
# tunnel connects there. Uses a distinct port (19135) from catcher's own
# udp-relay-control (19133, in frpc-catcher.toml) so both can coexist without a frps
# proxy-name/port collision on the rare occasion this file briefly registers
# against catcher instead.
[[proxies]]
name = "udp-relay-control-relay"
type = "tcp"
localIP = "127.0.0.1"
localPort = 19135
remotePort = 19135
