# The one permanent tunnel: dials catcher's own static IP directly.
serverAddr = "YOUR_CATCHER_STATIC_IP"
serverPort = 7000
auth.method = "token"
auth.token = "REPLACE_ME"

# Without transport.proxyProtocolVersion, the local Minecraft server would see every
# connection as coming from frpc's own loopback address instead of the real player's
# IP (frp's tunnel forwards the connection, but by default not the original source
# address). PROXY protocol v2 carries the real client IP through the tunnel so any
# IP-based logging, rate limiting, or banning on the game server itself still works.
[[proxies]]
name = "minecraft-catcher"
type = "tcp"
localIP = "127.0.0.1"
localPort = 25565
remotePort = 25565
transport.proxyProtocolVersion = "v2"

# Carries catcher/udp_relay_catcher.ts's control channel (catcher/udp_relay_catcher.ts
# <-> home-server/udp_relay_home.ts), NOT a UDP proxy. frp's own `type = "udp"` proxy
# relays replies from a dynamically allocated port instead of the port the request
# arrived on, which breaks NAT traversal for real clients (confirmed live
# 2026-07-18). frp's TCP proxying is unaffected by that bug, so this plain TCP proxy
# just carries a private, token-authenticated tunnel for the custom relay's own
# framed protocol.
[[proxies]]
name = "udp-relay-control"
type = "tcp"
localIP = "127.0.0.1"
localPort = 19133
remotePort = 19133
